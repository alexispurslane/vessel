name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    - target: bun-darwin-arm64
                      os: macos-latest
                      artifact: vessel-darwin-arm64
                    - target: bun-windows-x64
                      os: ubuntu-latest
                      artifact: vessel-windows-x64.exe
                    - target: bun-linux-x64
                      os: ubuntu-latest
                      artifact: vessel-linux-x64

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2

            - run: bun install

            - name: Build standalone binary
              run: bun scripts/build-standalone.ts --target "${{ matrix.target }}" --outfile "build/standalone/${{ matrix.artifact }}"

            - name: Upload binary artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: build/standalone/${{ matrix.artifact }}

    release:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Download all binary artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${GITHUB_REF_NAME}"
                  gh release create "$TAG" \
                      artifacts/vessel-darwin-arm64 \
                      artifacts/vessel-windows-x64.exe \
                      artifacts/vessel-linux-x64 \
                      --title "$TAG" \
                      --notes "Standalone binaries for $TAG"
