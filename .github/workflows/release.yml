name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    - target: bun-darwin-arm64
                      os: macos-latest
                      artifact: vessel-darwin-arm64
                      zerobox_pkg: "@zerobox/cli-darwin-arm64"
                      upx: false
                    - target: bun-windows-x64
                      os: ubuntu-latest
                      artifact: vessel-windows-x64.exe
                      zerobox_pkg: ""
                      upx: true
                    - target: bun-linux-x64
                      os: ubuntu-latest
                      artifact: vessel-linux-x64
                      zerobox_pkg: "@zerobox/cli-linux-x64"
                      upx: true

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2

            - run: bun install

            - name: Install zerobox platform binary
              if: matrix.zerobox_pkg != ''
              run: bun add --optional "${{ matrix.zerobox_pkg }}"

            - name: Install UPX (Linux)
              if: matrix.upx
              run: |
                  UPX_VER="4.2.4"
                  curl -L "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-amd64_linux.tar.xz" \
                      | tar xJ --strip-components=1 -C /usr/local/bin "upx-${UPX_VER}-amd64_linux/upx"

            - name: Build standalone binary
              run: bun scripts/build-standalone.ts --target "${{ matrix.target }}" --outfile "build/standalone/${{ matrix.artifact }}" ${{ matrix.upx && '--upx' || '' }}

            - name: Upload binary artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: build/standalone/${{ matrix.artifact }}

    release:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Download all binary artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="${GITHUB_REF_NAME}"
                  gh release create "$TAG" \
                      artifacts/vessel-darwin-arm64 \
                      artifacts/vessel-windows-x64.exe \
                      artifacts/vessel-linux-x64 \
                      --title "$TAG" \
                      --notes "Standalone binaries for $TAG"
